<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a63"/>
      <stop offset="0.55" stop-color="#0a2540"/>
      <stop offset="1" stop-color="#061a30"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#3fd0dc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="102" fill="none" stroke="#2b5f8f" stroke-opacity="0.55" stroke-width="3"/>

  <!-- sound-level bars -->
  <g fill="url(#bar)">
    <rect x="118" y="212" width="40" height="86"  rx="20"/>
    <rect x="176" y="164" width="40" height="134" rx="20"/>
    <rect x="234" y="118" width="40" height="180" rx="20"/>
    <rect x="292" y="150" width="40" height="148" rx="20"/>
    <rect x="350" y="196" width="40" height="102" rx="20"/>
  </g>

  <!-- baseline -->
  <rect x="112" y="318" width="284" height="8" rx="4" fill="#3fd0dc" opacity="0.5"/>

  <!-- wordmark -->
  <text x="256" y="418" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="118" font-weight="800" letter-spacing="6" fill="#ffffff">ACL</text>
  <text x="256" y="462" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="11" fill="#8fd8e0">MONITOR</text>
</svg>
